# This workflow will build package kpar using Sysand

name: Build kpar

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build_kpars:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
    
    - name: Install sysand
      run: |
        curl -fsSL https://client.sysand.com/install.sh | sh -s -- --version latest

    - name: Build kpars
      run: |
        cd requirements_management
        sysand build --update-meta
